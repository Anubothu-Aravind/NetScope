<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020C21" />
      <stop offset="100%" stop-color="#0F1B31" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A78B0" />
      <stop offset="100%" stop-color="#78A6D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <circle cx="64" cy="64" r="48" stroke="#384B64" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="64" cy="64" r="32" stroke="#4A78B0" stroke-width="1.5" fill="none" opacity="0.4" />
  <circle cx="64" cy="64" r="16" stroke="#78A6D8" stroke-width="1" fill="none" opacity="0.3" />
  
  <!-- Radar sweep line -->
  <line x1="64" y1="64" x2="102" y2="35" stroke="#4A78B0" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Center Core -->
  <circle cx="64" cy="64" r="6" fill="#78A6D8" filter="url(#glow)" />
  
  <!-- Outer nodes -->
  <circle cx="34" cy="45" r="4" fill="#4A78B0" />
  <circle cx="94" cy="85" r="4" fill="#4A78B0" />
  <circle cx="45" cy="94" r="3.5" fill="#384B64" />
</svg>
